name: Build
on:
    push:
        branches: [ "main" ]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: build-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-24.04
        timeout-minutes: 45
        steps:
            -   name: Checkout
                uses: actions/checkout@v7

            -   name: Check out WebViewWindow
                uses: actions/checkout@v7
                with:
                    repository: gwdevhub/WebViewWindow
                    path: WebViewWindow

            -   name: Build both targets in Docker
                run: bash build.sh all
                env:
                    WEBVIEW_WINDOW_DIR: ${{ github.workspace }}/WebViewWindow

            -   name: Upload the built programs
                uses: actions/upload-artifact@v7
                with:
                    name: discord-webview
                    path: bin/
                    if-no-files-found: error
